<div class="device-list-container">
  <h2>Incidents MAXBOX 5G</h2>

  <div *ngIf="isLoading" class="loading">Loading...</div>

  <div *ngIf="!isLoading && incidents.length === 0" class="no-results">
    No incidents found.
  </div>

  <table *ngIf="!isLoading && incidents.length > 0" class="devices-table">
    <thead>
      <tr>
        <th>Numéro de demande</th>
        <th>Date de création</th>
        <th>Sujet</th>
        <th>MSISDN</th>
        <th>Offre/Contrat</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let inc of incidents">
        <td>{{ inc.requestNumber }}</td>
        <td>{{ inc.created | date: 'short' }}</td>
        <td>{{ inc.sujet }}</td>
        <td>{{ inc.msisdn }}</td>
        <td>{{ inc.offreContrat }}</td>
        <td class="actions">
          <button class="btn-view" (click)="viewDevices(inc.msisdn)">Voir appareils</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!isLoading && incidents.length > 0" class="record-count">
    Total: {{ incidents.length }} incidents
  </div>
</div>
