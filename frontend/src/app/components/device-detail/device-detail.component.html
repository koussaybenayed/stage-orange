<div class="page">
  <button class="btn-back" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Retour
  </button>

  <div class="header">
    <div class="header-info">
      <h1>Device Details</h1>
      <p class="text-muted">{{ device?.serialNumber || ' ' }}</p>
    </div>
    <div class="action-buttons">
      <button class="btn-edit" (click)="toggleEdit()" *ngIf="!isEditing">Modifier</button>
      <button class="btn-cancel" (click)="toggleEdit()" *ngIf="isEditing">Annuler</button>
      <button class="btn-save" (click)="saveChanges()" *ngIf="isEditing" [disabled]="isLoading">Enregistrer</button>
      <button class="btn-delete" (click)="deleteDevice()">Supprimer</button>
    </div>
  </div>

  <!-- Skeleton -->
  <div class="card" *ngIf="isLoading">
    <div class="sk-card" style="border: none; box-shadow: none; padding: 0;">
      <div class="sk-bar sk-bar-40"></div>
      <div class="sk-bar sk-bar-100"></div>
      <div class="sk-bar sk-bar-100"></div>
    </div>
  </div>

  <div *ngIf="device && !isLoading" class="card detail-form">
    <div class="form-group">
      <label>Serial Number:</label>
      <input
        type="text"
        [(ngModel)]="editForm.serialNumber"
        [disabled]="!isEditing"
        class="form-control">
    </div>

    <div class="form-group">
      <label>IP Address:</label>
      <input
        type="text"
        [(ngModel)]="editForm.ip"
        [disabled]="!isEditing"
        class="form-control">
    </div>

    <div class="form-group">
      <label>Version:</label>
      <input
        type="text"
        [(ngModel)]="editForm.version"
        [disabled]="!isEditing"
        class="form-control">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>MSISDN:</label>
        <input
          type="text"
          [value]="device.msisdn || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>IMEI:</label>
        <input
          type="text"
          [value]="device.imei || '-'"
          disabled
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>SINR:</label>
        <input
          type="text"
          [(ngModel)]="editForm.sinr"
          [disabled]="!isEditing"
          class="form-control">
      </div>

      <div class="form-group">
        <label>RSRP:</label>
        <input
          type="text"
          [(ngModel)]="editForm.rsrp"
          [disabled]="!isEditing"
          class="form-control">
      </div>

      <div class="form-group">
        <label>RSRQ:</label>
        <input
          type="text"
          [(ngModel)]="editForm.rsrq"
          [disabled]="!isEditing"
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Downlink Throughput:</label>
        <input
          type="text"
          [value]="device.downlinkThroughput || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>Uplink Throughput:</label>
        <input
          type="text"
          [value]="device.uplinkThroughput || '-'"
          disabled
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Last Inform:</label>
        <input
          type="text"
          [value]="device.lastInform | date: 'short' || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>Last Boot:</label>
        <input
          type="text"
          [value]="device.lastBoot | date: 'short' || '-'"
          disabled
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Cell ID:</label>
        <input
          type="text"
          [value]="device.cellId || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>APN Data:</label>
        <input
          type="text"
          [value]="device.apnData || '-'"
          disabled
          class="form-control">
      </div>
    </div>
  </div>
</div>
