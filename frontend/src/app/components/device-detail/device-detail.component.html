<div class="device-detail-container">
  <div class="header">
    <button class="btn-back" (click)="goBack()">← Back</button>
    <h2>Device Details</h2>
    <div class="action-buttons">
      <button class="btn-edit" (click)="toggleEdit()" *ngIf="!isEditing">Edit</button>
      <button class="btn-cancel" (click)="toggleEdit()" *ngIf="isEditing">Cancel</button>
      <button class="btn-save" (click)="saveChanges()" *ngIf="isEditing" [disabled]="isLoading">Save</button>
      <button class="btn-delete" (click)="deleteDevice()">Delete</button>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">Loading device details...</div>

  <div *ngIf="device && !isLoading" class="detail-form">
    <div class="form-group">
      <label>Serial Number:</label>
      <input 
        type="text" 
        [(ngModel)]="editForm.serialNumber"
        [disabled]="!isEditing"
        class="form-control">
    </div>

    <div class="form-group">
      <label>IP Address:</label>
      <input 
        type="text" 
        [(ngModel)]="editForm.ip"
        [disabled]="!isEditing"
        class="form-control">
    </div>

    <div class="form-group">
      <label>Version:</label>
      <input 
        type="text" 
        [(ngModel)]="editForm.version"
        [disabled]="!isEditing"
        class="form-control">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>MSISDN:</label>
        <input 
          type="text" 
          [value]="device.msisdn || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>IMEI:</label>
        <input 
          type="text" 
          [value]="device.imei || '-'"
          disabled
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>SINR:</label>
        <input 
          type="text" 
          [(ngModel)]="editForm.sinr"
          [disabled]="!isEditing"
          class="form-control">
      </div>

      <div class="form-group">
        <label>RSRP:</label>
        <input 
          type="text" 
          [(ngModel)]="editForm.rsrp"
          [disabled]="!isEditing"
          class="form-control">
      </div>

      <div class="form-group">
        <label>RSRQ:</label>
        <input 
          type="text" 
          [(ngModel)]="editForm.rsrq"
          [disabled]="!isEditing"
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Downlink Throughput:</label>
        <input 
          type="text" 
          [value]="device.downlinkThroughput || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>Uplink Throughput:</label>
        <input 
          type="text" 
          [value]="device.uplinkThroughput || '-'"
          disabled
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Last Inform:</label>
        <input 
          type="text" 
          [value]="device.lastInform | date: 'short' || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>Last Boot:</label>
        <input 
          type="text" 
          [value]="device.lastBoot | date: 'short' || '-'"
          disabled
          class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Cell ID:</label>
        <input 
          type="text" 
          [value]="device.cellId || '-'"
          disabled
          class="form-control">
      </div>

      <div class="form-group">
        <label>APN Data:</label>
        <input 
          type="text" 
          [value]="device.apnData || '-'"
          disabled
          class="form-control">
      </div>
    </div>
  </div>
</div>
