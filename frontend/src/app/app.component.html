<div class="app-shell" [class.sidebar-collapsed]="isCollapsedDisplay">

  <aside class="sidebar" [class.open]="sidebarOpen" (mouseenter)="onSidebarEnter()" (mouseleave)="onSidebarLeave()">

    <div class="sidebar-header">
      <a routerLink="/dashboard" class="sidebar-brand" (click)="closeMobileSidebar()">
        <img src="assets/orange-logo.svg" alt="Orange" class="sidebar-logo">
        <span class="sidebar-brand-text">Monitoring</span>
      </a>
      <button class="icon-btn collapse-btn" (click)="toggleCollapse()" [attr.aria-label]="isCollapsedDisplay ? 'Étendre le menu' : 'Réduire le menu'" title="Réduire / étendre">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <line x1="9" y1="4" x2="9" y2="20"></line>
          <polyline points="13,9 10,12 13,15"></polyline>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/devices" routerLinkActive="active" (click)="closeMobileSidebar()" title="Incidents">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </span>
        <span class="nav-label">Incidents</span>
      </a>

      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileSidebar()" title="Dashboard">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/home-zone" routerLinkActive="active" (click)="closeMobileSidebar()" title="Dashboard Home Zone">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v18h18"></path><path d="M7 13l3-3 4 4 5-5"></path><path d="M7 9h4"></path>
          </svg>
        </span>
        <span class="nav-label">Dashboard Home Zone</span>
      </a>

      <a routerLink="/problem-map" routerLinkActive="active" (click)="closeMobileSidebar()" title="Carte des problèmes">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </span>
        <span class="nav-label">Carte des problèmes</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="nav-label sidebar-version">Orange Monitoring v1.0</span>
    </div>
  </aside>

  <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="closeMobileSidebar()"></div>

  <div class="app-main">
    <header class="app-header">
      <button class="icon-btn hamburger" (click)="toggleMobileSidebar()" aria-label="Ouvrir le menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <span class="header-title">Monitoring Réseau</span>

      <span class="header-spacer"></span>

      <button class="icon-btn theme-toggle" (click)="toggleTheme()" [attr.aria-label]="(theme$ | async) === 'dark' ? 'Activer le thème clair' : 'Activer le thème sombre'" title="Basculer le thème">
        <ng-container *ngIf="(theme$ | async) === 'dark'; else lightIcon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </ng-container>
        <ng-template #lightIcon>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </ng-template>
      </button>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="footer">
      <span>&copy; Orange 2026 — Monitoring Réseau</span>
    </footer>
  </div>
</div>
